name: Universal APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File (If present)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Zip found, extracting..."
            unzip -o *.zip -d project_files
            if [ -d project_files/* ]; then
              cp -r project_files/*/* . 2>/dev/null || cp -r project_files/* . 2>/dev/null || true
            else
              cp -r project_files/* .
            fi
          else
            echo "No zip file detected, using repository files directly."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Generate Dummy Configs & Keys
        run: |
          # 1. Environment dummy files
          touch .env.example .env local.properties

          # 2. Dummy Google Services JSON (if needed by plugins)
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.app"}}}]}' > app/google-services.json
          fi

          # 3. Create missing debug.keystore if required
          if [ ! -f debug.keystore ] && [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

      - name: Ensure Gradle Executable & Wrapper Exists
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

p

